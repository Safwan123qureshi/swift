<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Swift Sign Group AI Assistant - Your trusted partner for IT Solutions and Business Management.">
    <meta name="theme-color" content="#007bff">
    <title>Swift Sign AI Assistant</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Main Website Content -->
    <div style="padding: 50px; font-family: Arial, sans-serif;">
        <h1>Welcome to Swift Sign Group</h1>
        <p>Your trusted partner for IT Solutions and Business Management.</p>
    </div>

    <!-- Floating Chat Toggle Button (Blue Icon at bottom right) -->
    <div class="chat-icon-btn" onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 24px; z-index: 1000;" title="Chat with Swift Sign AI">
        <i class="fa-solid fa-comments"></i>
    </div>

    <!-- Chat Window Container -->
    <div id="chat-container" class="chat-hidden" style="display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); flex-direction: column; overflow: hidden; z-index: 1000;">
        
        <!-- Chat Header -->
        <div style="background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 16px;">Swift Sign AI</h3>
            <span onclick="toggleChat()" style="cursor: pointer; font-size: 20px; font-weight: bold;" title="Close">&times;</span>
        </div>

        <!-- Chat Messages Box -->
        <div id="chatBox" style="flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; font-size: 14px;">
            <div class="bot-msg" style="margin-bottom: 10px; background: #e9ecef; padding: 8px 12px; border-radius: 8px;">
                <strong>AI:</strong> Hello! How can I assist you with Swift Sign services today?
            </div>
        </div>

        <!-- Chat Input Area -->
        <div style="padding: 10px; background: white; border-top: 1px solid #ddd; display: flex; gap: 8px;">
            <input type="text" id="userInput" placeholder="Type your query..." style="flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none;" autocomplete="off" />
            <button onclick="sendMessage()" id="sendBtn" style="background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;" title="Send message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
